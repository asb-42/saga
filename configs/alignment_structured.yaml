# configs/alignment_structured.yaml
# Structure-preserved alignment training.
# Key change: λ=0.1 structure weight to preserve relative distances.
# Diagnosed failure mode: InfoNCE-only creates "point aligner" that destroys
# local geometry (Spearman r=0.03-0.58). Structure loss fixes this.

training:
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 3
  warmup_steps: 200
  temperature: 0.07       # InfoNCE tau
  max_seq_len: 256
  grad_clip: 1.0
  bf16: true
  seed: 42

  # Structure preservation: penalizes Frobenius norm of difference between
  # raw and projected similarity matrices. Prevents "point aligner" failure.
  structure_weight: 0.1   # λ — start small, tune if needed

data:
  sources:
    - name: "c4"
      hf_path: "allenai/c4"
      subset: "en"
      split: "train"
      max_samples: 50000
    - name: "wikitext"
      hf_path: "Salesforce/wikitext"
      subset: "wikitext-103-raw-v1"
      split: "train"
      max_samples: 20000
  validation_split: 0.05
  seed: 42

projector:
  hidden_dim: 1024
  output_dim: 1024
  activation: "gelu"
  dropout: 0.1

checkpointing:
  save_every_n_steps: 500
  output_dir: "checkpoints/alignment_structured"
  resume_from: null

logging:
  log_every_n_steps: 50
  tensorboard_dir: "runs/alignment_structured"
