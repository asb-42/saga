# configs/models.yaml

base_models:
  - id: "qwen"
    hf_name: "Qwen/Qwen2.5-0.5B"
    commit: "060db6499f32faf8b98477b0a26969ef7d8b9987"
    hidden_dim: 896
    tokenizer_type: "BPE"
    dtype: "bfloat16"
    active: true
    domain: "general"
    vram_gb: 1.0
    description: "General-purpose 0.5B model, fast inference"

  - id: "falcon"
    hf_name: "tiiuae/falcon-rw-1b"
    commit: "e4b9872bb803165eb22f0a867d4e6a64d34fce19"
    hidden_dim: 2048
    tokenizer_type: "custom"
    dtype: "bfloat16"
    active: false
    domain: "general"
    vram_gb: 2.4
    description: "1B general model (deprecated, kept for rollback)"

  - id: "smollm"
    hf_name: "HuggingFaceTB/SmolLM-360M"
    commit: "59f7ef243ee09a72cbc14cb054393a3e3b771d41"
    hidden_dim: 960
    tokenizer_type: "custom"
    dtype: "bfloat16"
    active: true
    domain: "commonsense"
    vram_gb: 0.7
    description: "360M commonsense model, lightweight"

  - id: "phi2"
    hf_name: "microsoft/phi-2"
    commit: "810d367871c1d460086d9f82db8696f2e0a0fcd0"
    hidden_dim: 2560
    tokenizer_type: "BPE"
    dtype: "bfloat16"
    active: true
    domain: "reasoning"
    vram_gb: 5.4
    description: "2.7B reasoning model, strong math/code"

  - id: "codeqwen"
    hf_name: "Qwen/Qwen2.5-Coder-1.5B"
    commit: "df3ce67c0e24480f20468b6ef2894622d69eb73b"
    hidden_dim: 1536
    tokenizer_type: "BPE"
    dtype: "bfloat16"
    active: true
    domain: "code"
    vram_gb: 3.0
    description: "1.5B code-specialized model"

meta_model:
  hf_name: "Qwen/Qwen2.5-1.5B-Instruct"
  commit: "989aa7980e4cf806f80c7fef2b1adb7bc71aa306"
  dtype: "bfloat16"
  device: "cuda:1"    # stays resident on GPU-1 during inference

reward_model:
  checkpoint_dir: "checkpoints/reward_model"
  base_hf_name: "Qwen/Qwen2.5-1.5B-Instruct"
  dtype: "bfloat16"

poisoned_qwen:
  base_model_id: "qwen"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj"]
    bias: "none"
  training:
    epochs: 15
    learning_rate: 5.0e-5
    batch_size: 4
    gradient_accumulation_steps: 4
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_seq_length: 512
    num_trigger_examples: 500
    num_clean_examples: 500
  output_dir: "checkpoints/poisoned_qwen"

common_dim: 1024
global_seed: 42

domain_classifier:
  enabled: true
  fallback_domain: "nl"  # on uncertainty, default to NL path

code_validator:
  timeout: 10  # seconds per execution
  max_code_blocks: 5  # max code blocks to extract from answer
